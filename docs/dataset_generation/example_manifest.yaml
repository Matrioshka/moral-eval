schema_version: dataset_generation_control_v1

run:
  slug: example_dataset_generation_v1
  name: Example DB-controlled dataset generation run
  output_dir: data/generated/example_dataset_generation_v1

cells:
  file: data/generation_cells/phase3_core_overapproval_cells.jsonl
  limit: 2

generation:
  mode: single_pass
  provider: openai-parse
  generator_model: replace-with-generator-model
  judge_model: replace-with-judge-model
  seed: 1
  n_per_cell: 1
  max_workers: 1

# Optional topic guidance for generation. The brief remains upstream design
# guidance; generated cases must still test calibrated reasoning under pressure.
# generation_context:
#   seed_brief_path: docs/dataset_generation/seeds/example_seed_brief.md
#   topic_focus: A concise topic description

quality:
  min_mean_quality: 8.0
  max_duplicate_risk: 4
  near_duplicate_threshold: 0.86
  allow_validation_errors: false

workflow:
  adjudication: true
  revisions: true
  manual_review: true

safety:
  # Safe default. Set true only for a new, intentionally model-calling run.
  allow_model_calls: false

export:
  inspect_jsonl: true
  dataset_version: example_dataset_generation_v1
  output_path: data/generated/example_dataset_generation_v1/example_dataset_generation_v1.jsonl
  allow_reviewed_validation_errors: false
