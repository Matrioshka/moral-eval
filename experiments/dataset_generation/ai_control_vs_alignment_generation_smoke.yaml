schema_version: dataset_generation_control_v1

run:
  slug: ai_control_vs_alignment_generation_smoke_v1
  name: AI control vs alignment one-cell model generation smoke
  output_dir: tmp/dataset_generation/ai_control_vs_alignment_generation_smoke_v1

cells:
  file: data/generation_cells/phase3_ai_control_vs_alignment_cells.jsonl
  limit: 1

generation:
  mode: single_pass
  provider: openai-parse
  generator_model: gpt-4o-mini
  judge_model: gpt-4o-mini
  seed: 1
  n_per_cell: 1
  max_workers: 1

quality:
  min_mean_quality: 8.0
  max_duplicate_risk: 4
  near_duplicate_threshold: 0.86
  allow_validation_errors: false

workflow:
  adjudication: true
  revisions: true
  manual_review: true

safety:
  # Explicitly enabled only for this one-cell generation smoke.
  allow_model_calls: true

export:
  inspect_jsonl: true
  dataset_version: phase3_ai_control_vs_alignment_generation_smoke_v1
  output_path: tmp/dataset_generation/ai_control_vs_alignment_generation_smoke_v1/phase3_ai_control_vs_alignment_generation_smoke_v1.jsonl
  allow_reviewed_validation_errors: false
