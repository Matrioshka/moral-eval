<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Run Browser{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body>
  <header class="topbar">
    <nav class="topnav">
      <div class="nav-links">
        <a class="{% if active_nav == 'runs' %}active{% endif %}" href="{{ url_for('runs') }}">Runs</a>
        <a class="{% if active_nav == 'pipeline_runs' %}active{% endif %}" href="{{ url_for('pipeline_runs') }}">Pipeline Runs</a>
        <a class="{% if active_nav == 'experiments' %}active{% endif %}" href="{{ url_for('experiments') }}">Experiments</a>
        <a class="{% if active_nav == 'reference' %}active{% endif %}" href="{{ url_for('reference') }}">Reference</a>
        <a class="{% if active_nav == 'views' %}active{% endif %}" href="{{ url_for('views') }}">Views</a>
      </div>
      <form class="nav-search {% if active_nav == 'search' %}active{% endif %}" action="{{ url_for('search') }}" method="get">
        <span class="search-label" aria-hidden="true"><span class="search-icon">&#128269;</span> Search</span>
        <input type="search" name="q" value="{{ q or '' }}" placeholder="Search experiments, samples, responses...">
      </form>
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
